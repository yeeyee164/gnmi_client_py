username: "admin"
password: "password"
debug: false

subscriptions:
  interfaces_ipi:
    mode: "stream"
    encoding: "json_ietf"
    subscription:
      path:
      - 'ipi:/interfaces/interface[name="mgmt0"]/state/counters'
      - 'ipi:/interfaces/interface[name="te0/1"]/state'
      - 'ipi:/interfaces/interface[name="te0/2"]/state'
      mode: "sample"
      sample_interval: 43 # 43 seconds

  interfaces:
    mode: "stream"
    encoding: "json_ietf"
    subscription:
      path:
      - '/interfaces/interface[name="te0/12"]/state/counters'
      - '/interfaces/interface[name="te0/13"]/state/counters'
      - '/interfaces/interface[name="te0/21"]/state'
      mode: "sample"
      sample_interval: 60 # 43 seconds
        
targets:
  10.1.11.82:9339:
    subscriptions:
      - interfaces
      - interfaces_ipi
    username: "admin"
    password: "Frontier12#"
    times: 3 #spawn five times
    update_only: false

outputs:
  log_file:
    type: file
    file-type: telemetry_res.json
    format: json